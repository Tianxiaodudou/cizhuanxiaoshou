name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KS: ${{ secrets.CZXS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/czxs.p12"
            echo "CZXS_KEYSTORE=$RUNNER_TEMP/czxs.p12" >> $GITHUB_ENV
            echo "HAS_RELEASE_KS=1" >> $GITHUB_ENV
          else
            echo "HAS_RELEASE_KS=0" >> $GITHUB_ENV
          fi

      - name: Build APK
        env:
          CZXS_STORE_PASSWORD: ${{ secrets.CZXS_STORE_PASSWORD }}
          CZXS_KEY_ALIAS: ${{ secrets.CZXS_KEY_ALIAS }}
          CZXS_KEY_PASSWORD: ${{ secrets.CZXS_KEY_PASSWORD }}
        run: |
          if [ "$HAS_RELEASE_KS" = "1" ]; then
            ./gradlew :android-app:app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :android-app:app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find android-app/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: czxs-apk
          path: out/*.apk
