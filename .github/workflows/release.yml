name: Release (FPK + APK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          cur="$(sed 's/^\xEF\xBB\xBF//' VERSION | tr -d '[:space:]')"
          major="$(echo "$cur" | cut -d. -f1)"
          minor="$(echo "$cur" | cut -d. -f2)"
          patch="$(echo "$cur" | cut -d. -f3)"
          new="$major.$minor.$((patch + 1))"
          printf '%s' "$new" > VERSION
          sed -i -E "s/^[[:space:]]*version[[:space:]]*=.*/version               = $new/" packaging/czxs-go/manifest
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "bumped to $new"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION packaging/czxs-go/manifest
          git commit -m "release: v${{ steps.bump.outputs.version }}"
          git push

  fpk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web
        working-directory: web
        run: |
          npm install
          npm run build
          mkdir -p ../server-go/web/dist
          cp -r dist/* ../server-go/web/dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test + build Go server
        working-directory: server-go
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go test ./...
          go build -trimpath -ldflags="-s -w" -o ../packaging/czxs-go/app/bin/czxs .

      - name: Build FPK
        run: |
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o fnpack
          chmod +x fnpack
          ./fnpack build --directory packaging/czxs-go

      - uses: actions/upload-artifact@v4
        with:
          name: czxs-fpk
          path: ./*.fpk

  apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :android-app:app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find android-app/app/build/outputs/apk -name '*.apk' -exec cp {} out/czxs-client-${{ needs.prepare.outputs.version }}.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: czxs-apk
          path: out/*.apk

  publish:
    needs: [prepare, fpk, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: czxs-fpk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: czxs-apk
          path: dist

      - name: Rename FPK
        run: |
          for f in dist/*.fpk; do
            mv "$f" "dist/czxs_${{ needs.prepare.outputs.version }}_x86_64.fpk"
          done
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: 服务端 FPK + Android 客户端 APK
          files: dist/*
