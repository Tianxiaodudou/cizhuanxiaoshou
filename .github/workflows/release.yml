name: Release FPK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web (React + Vite)
        working-directory: web
        run: |
          npm install
          npm run build
          mkdir -p ../server-go/web/dist
          cp -r dist/* ../server-go/web/dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test Go server
        working-directory: server-go
        run: go test ./...

      - name: Build Go server (linux/amd64)
        working-directory: server-go
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o ../packaging/czxs-go/app/bin/czxs .

      - name: Download fnpack
        run: |
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack

      - name: Build FPK
        run: ./fnpack build --directory packaging/czxs-go

      - uses: actions/upload-artifact@v4
        with:
          name: czxs-fpk
          path: ./*.fpk

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: czxs-fpk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: 服务端功能暂且完善
          files: dist/*.fpk
